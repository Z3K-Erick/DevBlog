<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura de post — {EG} DevBlog</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body data-page="post" id="top">

  <!-- ========================================================================
       HEADER PÚBLICO
       ======================================================================== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Inicio DevBlog">
        <span class="logo-brace">{</span><span class="logo-letters">EG</span><span class="logo-brace">}</span>
      </a>

      <nav class="main-nav" aria-label="Principal">
        <a href="index.html" class="nav-link">Mi blog</a>
        <a href="index.html#feed" class="nav-link is-active">Posts</a>
        <a href="index.html#sobre-mi" class="nav-link">Sobre mí</a>
      </nav>

      <div class="header-actions">
        <form class="header-search" id="header-search" role="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input type="search" placeholder="Buscar post, tema..." aria-label="Buscar publicaciones">
        </form>

        <!-- Botón invisible al lado de la foto de perfil -->
        <button type="button" class="secret-login-btn" id="secret-login-btn" aria-label="Acceso administrador"></button>

        <!-- Foto de perfil circular -->
        <button type="button" class="avatar-btn" id="avatar-btn" aria-label="Perfil de autor">
          <img src="assets/images/avatar.svg" alt="Foto de perfil">
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================
       CONTENIDO DEL ARTÍCULO (EL HILO)
       ======================================================================== -->
  <main class="container post-page" id="post-root"></main>

  <!-- ========================================================================
       FOOTER
       ======================================================================== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2026 DevBlog · Hecho por Erick</span>
      <div class="footer-links">
        <a href="https://github.com/Z3K-Erick/DevBlog" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="#top">Volver arriba ↑</a>
      </div>
    </div>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
